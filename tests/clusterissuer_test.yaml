suite: ClusterIssuer
templates:
  - templates/clusterissuer.yaml
release:
  name: test
chart:
  version: 0.0.1
  appVersion: 0.0.1
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the ClusterIssuer keyed by name with the spec passed through
    set:
      clusterIssuers:
        example:
          spec:
            ca:
              secretName: root-ca
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ClusterIssuer
      - isAPIVersion:
          of: cert-manager.io/v1
      - equal:
          path: metadata.name
          value: example
      - notExists:
          path: metadata.namespace
      - notExists:
          path: metadata.annotations
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - equal:
          path: spec
          value:
              ca:
                secretName: root-ca

  - it: merges custom annotations and labels
    set:
      clusterIssuers:
        example:
          annotations:
            owner: platform-team
          labels:
            env: test
          spec:
            ca:
              secretName: root-ca
    asserts:
      - equal:
          path: metadata.annotations.owner
          value: platform-team
      - equal:
          path: metadata.labels.env
          value: test
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: test

  - it: honours an apiVersion override
    set:
      clusterIssuers:
        example:
          apiVersion: example.io/v9
          spec:
            ca:
              secretName: root-ca
    asserts:
      - isAPIVersion:
          of: example.io/v9

  - it: renders entries in key order
    set:
      clusterIssuers:
        zeta:
          spec:
            ca:
              secretName: root-ca
        alpha:
          spec:
            ca:
              secretName: root-ca
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: alpha
        documentIndex: 0
      - equal:
          path: metadata.name
          value: zeta
        documentIndex: 1

  - it: fails when spec is missing
    set:
      clusterIssuers:
        broken:
          labels: {}
    asserts:
      - failedTemplate:
          errorPattern: ClusterIssuer spec is required
