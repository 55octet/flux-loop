suite: Issuer
templates:
  - templates/issuer.yaml
release:
  name: test
chart:
  version: 0.0.1
  appVersion: 0.0.1
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the Issuer keyed by name with the spec passed through
    set:
      issuers:
        example:
          namespace: my-app
          spec:
            selfSigned: {}
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Issuer
      - isAPIVersion:
          of: cert-manager.io/v1
      - equal:
          path: metadata.name
          value: example
      - equal:
          path: metadata.namespace
          value: my-app
      - notExists:
          path: metadata.annotations
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - equal:
          path: spec
          value:
              selfSigned: {}

  - it: merges custom annotations and labels
    set:
      issuers:
        example:
          namespace: my-app
          annotations:
            owner: platform-team
          labels:
            env: test
          spec:
            selfSigned: {}
    asserts:
      - equal:
          path: metadata.annotations.owner
          value: platform-team
      - equal:
          path: metadata.labels.env
          value: test
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: test

  - it: honours an apiVersion override
    set:
      issuers:
        example:
          apiVersion: example.io/v9
          namespace: my-app
          spec:
            selfSigned: {}
    asserts:
      - isAPIVersion:
          of: example.io/v9

  - it: renders entries in key order
    set:
      issuers:
        zeta:
          namespace: my-app
          spec:
            selfSigned: {}
        alpha:
          namespace: my-app
          spec:
            selfSigned: {}
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: alpha
        documentIndex: 0
      - equal:
          path: metadata.name
          value: zeta
        documentIndex: 1

  - it: fails when spec is missing
    set:
      issuers:
        broken:
          namespace: my-app
    asserts:
      - failedTemplate:
          errorPattern: Issuer spec is required

  - it: fails when namespace is missing
    set:
      issuers:
        broken:
          spec:
            selfSigned: {}
    asserts:
      - failedTemplate:
          errorPattern: Issuer broken namespace is required
