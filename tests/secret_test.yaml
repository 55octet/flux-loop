suite: Secret
templates:
  - templates/secret.yaml
release:
  name: test
chart:
  version: 0.0.1
  appVersion: 0.0.1
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: defaults type to Opaque and base64-encodes values
    set:
      secrets:
        - name: creds
          namespace: my-app
          values:
            username: admin
            password: s3cret
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - isAPIVersion:
          of: v1
      - equal:
          path: metadata.name
          value: creds
      - equal:
          path: metadata.namespace
          value: my-app
      - equal:
          path: type
          value: Opaque
      - equal:
          path: data.username
          value: YWRtaW4=
      - equal:
          path: data.password
          value: czNjcmV0

  - it: honours type, annotations and labels
    set:
      secrets:
        - name: registry
          namespace: my-app
          type: kubernetes.io/dockerconfigjson
          annotations:
            owner: platform-team
          labels:
            env: test
          values:
            .dockerconfigjson: '{"auths":{}}'
    asserts:
      - equal:
          path: type
          value: kubernetes.io/dockerconfigjson
      - equal:
          path: data[".dockerconfigjson"]
          value: eyJhdXRocyI6e319
      - equal:
          path: metadata.annotations.owner
          value: platform-team
      - equal:
          path: metadata.labels.env
          value: test
