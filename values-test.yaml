# Declare variables to be passed into your templates.

nameOverride: ""
fullnameOverride: ""

helmRepositories:
  - name: metallb
    namespace: bootstrap
    interval: 5m
    url: https://metallb.github.io/metallb

ociRepositories:
  - name: cloudnative-pg
    namespace: cnpg
    spec:
      interval: 5m
      url: oci://ghcr.io/cloudnative-pg/charts/cloudnative-pg
      ref:
        tag: 0.27.1

namespaces:
  - name: unclebob
    annotations:
      one: here
      two: three
    labels:
      labelOne: two
      labelTwo: three

helmReleases:
  chart:
    namespace: chart-ns
    spec:
      interval: 1m
      install:
        remediation:
          retries: 3

bundles:
  example-bundle:
    annotations:
      owner: platform-team
    labels:
      env: test
    spec:
      sources:
        - useDefaultCAs: true
        - secret:
            name: my-root-ca
            key: ca.crt
      target:
        configMap:
          key: trust-bundle.pem
        namespaceSelector:
          matchLabels:
            trust: enabled

configMaps:
  - name: app-config
    namespace: kube-system
    annotations:
      owner: platform-team
    labels:
      env: test
    values:
      LOG_LEVEL: debug
      replicas: 3
      config.yaml: |
        server:
          port: 8080

secrets:
  - name: test
    namespace: kube-system
    type: kubernetes/tls
    values:
      xzy: "no"
  - name: bob
    namespace: kube-system
    values:
      test: "yes"
